# Production settings. Every one of these is a value that is wrong in a way
# nobody notices until it matters.
apiVersion: v1
kind: ConfigMap
metadata:
  name: huntwell-config
  namespace: huntwell
data:
  # OFF. Dev mode drops the Secure flag from session cookies so they work over
  # plain http on huntwell.localhost. Left on behind TLS, the browser will send
  # the session cookie over an unencrypted connection given the chance.
  HUNTWELL_DEV: "0"

  # OFF. Anyone who finds the URL would otherwise get an account and start
  # spending your agent tokens. Turn it on deliberately, when you want that.
  HUNTWELL_OPEN_SIGNUP: "0"

  # Where the app lives, for the links in emails. Without it, a verification
  # email has no link in it and nobody can confirm an account.
  HUNTWELL_PUBLIC_URL: "https://CHANGEME.example.com"

  # Object storage for the files `assets` plans collect. Without this the code
  # falls back to a directory inside whichever pod wrote it — which disappears
  # when that pod restarts, and which the run Job in a different pod cannot see.
  HUNTWELL_S3_ENDPOINT: "http://minio.huntwell.svc.cluster.local:9000"
  HUNTWELL_S3_BUCKET: "huntwell"

  # What you charge per million billable tokens. Read the margin note in
  # docs/ before changing it: at $5 this is roughly 2x on Sonnet and a loss
  # on Opus.
  HUNTWELL_SELL_USD_PER_MTOKEN: "5.00"

  # The worker image a run Job launches. It must be the registry-qualified,
  # immutable tag — the `images:` transformer in kustomization.yaml does not
  # reach inside a ConfigMap value, so this one is set by hand and is the
  # easiest thing in the whole overlay to forget on a release.
  RUN_WORKER_IMAGE: "ghcr.io/CHANGEME/huntwell-worker:0.1.0"
