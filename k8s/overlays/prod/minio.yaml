# Object storage for the files `assets` plans collect.
#
# Without it `objstore.rs` falls back to a directory under the data dir. That
# works on one machine and is wrong here for a reason that is easy to miss: a
# run executes in its own Job pod, so the file it writes lands on that pod's
# filesystem and disappears with it. The download would 404 minutes later.
#
# MinIO rather than real S3 because this is one server and one bill. Moving to
# S3, R2 or Spaces later is four settings in the ConfigMap and the Secret —
# nothing in the application knows the difference.
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: huntwell
spec:
  selector: { app: minio }
  ports:
    - { name: s3, port: 9000, targetPort: 9000 }
    - { name: console, port: 9001, targetPort: 9001 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: huntwell
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels: { app: minio }
  template:
    metadata:
      labels: { app: minio }
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2026-08-13T00-00-00Z
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            # MinIO's own admin credentials. The application uses the same pair
            # as its S3 access key — one identity, because there is one client.
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: huntwell-secrets, key: HUNTWELL_S3_ACCESS_KEY } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: huntwell-secrets, key: HUNTWELL_S3_SECRET_KEY } }
          ports:
            - { name: s3, containerPort: 9000 }
            - { name: console, containerPort: 9001 }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - { name: data, mountPath: /data }
          resources:
            requests: { cpu: "50m", memory: "256Mi" }
            limits: { cpu: "1", memory: "2Gi" }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 100Gi }
---
# MinIO starts with no buckets, and the application does not create one. A Job
# rather than an init container on every service: it has to happen once, not
# once per pod, and a failure here should be visible as a failed Job rather than
# as five services in CrashLoopBackOff.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bucket
  namespace: huntwell
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: mc
          image: minio/mc:RELEASE.2026-08-13T00-00-00Z
          command:
            - sh
            - -c
            - |
              set -e
              until mc alias set hw http://minio:9000 "$AK" "$SK" >/dev/null 2>&1; do
                echo "waiting for minio"; sleep 2
              done
              # Idempotent: --ignore-existing so a re-apply is not a failure.
              mc mb --ignore-existing hw/huntwell
              echo "bucket ready"
          env:
            - name: AK
              valueFrom: { secretKeyRef: { name: huntwell-secrets, key: HUNTWELL_S3_ACCESS_KEY } }
            - name: SK
              valueFrom: { secretKeyRef: { name: huntwell-secrets, key: HUNTWELL_S3_SECRET_KEY } }
