# Production. The difference from k3d is not the manifests but what the cluster
# has to do for itself:
#
#   |                    | k3d (dev)              | production               |
#   |--------------------|------------------------|--------------------------|
#   | images reach a node| k3d image import       | pulled from a registry   |
#   | image tags         | :dev, rebuilt in place | immutable, one per release|
#   | TLS                | none, plain http       | terminated at Cloudflare |
#   | reached by         | localhost:8890         | a tunnel, no open ports  |
#   | signups            | open                   | closed                   |
#   | cookies            | not Secure (dev mode)  | Secure                   |
#
# None of it is inferred. Each one fails silently when guessed wrong — an image
# that was never going to pull, a cookie the browser will not send back.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: huntwell

resources:
  - ../../base
  - minio.yaml
  - cloudflared.yaml
  - backup.yaml

# One tag for every image, and it must be a version or a commit sha — never a
# tag you will push again. The Deployments pull IfNotPresent, so a moving tag
# means a node that already has the image keeps running the old one however
# often you redeploy, and nothing anywhere reports that.
#
# Change `newName` to your registry, `newTag` on every release.
images:
  - name: huntwell-website
    newName: ghcr.io/CHANGEME/huntwell-website
    newTag: "0.1.0"
  - name: huntwell-admin
    newName: ghcr.io/CHANGEME/huntwell-admin
    newTag: "0.1.0"
  - name: huntwell-planning
    newName: ghcr.io/CHANGEME/huntwell-planning
    newTag: "0.1.0"
  - name: huntwell-scheduling
    newName: ghcr.io/CHANGEME/huntwell-scheduling
    newTag: "0.1.0"
  - name: huntwell-notification
    newName: ghcr.io/CHANGEME/huntwell-notification
    newTag: "0.1.0"

patches:
  - path: config-patch.yaml
  - path: postgres-patch.yaml
  - path: ingress-patch.yaml

secretGenerator:
  - name: huntwell-secrets
    envs:
      - secrets.env

generatorOptions:
  # A fixed name, no hash suffix: the run-worker Job references this Secret by
  # name at dispatch time, and a hashed name would be a Job that cannot start.
  disableNameSuffixHash: true
