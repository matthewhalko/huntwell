# In production nothing reaches the cluster from outside: cloudflared dials out
# and traffic arrives down that connection. The Ingress stays because the tunnel
# forwards to the ingress controller, which is what routes to the website.
#
# `ingressClassName` is named, not inferred. A cluster can have several
# controllers or none, and an Ingress no controller claims is not an error —
# it is an object that sits there while nothing serves it. Change `traefik` to
# whatever `kubectl get ingressclass` reports if you installed a different one.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: huntwell
  namespace: huntwell
spec:
  ingressClassName: traefik
