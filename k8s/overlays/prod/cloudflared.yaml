# The Cloudflare tunnel: how the outside world reaches this cluster.
#
# It dials OUT to Cloudflare and holds the connection open; requests ride back
# down it. The server needs no inbound ports at all — you can drop everything at
# the firewall and the site still works — and Cloudflare terminates TLS, so
# there is no cert-manager here and nothing to renew.
#
# Routing lives in the Cloudflare dashboard, not here: point the tunnel's public
# hostname at http://traefik.kube-system.svc.cluster.local:80 (or whatever your
# ingress controller's Service is). Going straight to the website Service would
# work too and would skip the Ingress, which is fine today and stops being fine
# the moment anything else needs a path.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: huntwell
  labels: { app: cloudflared }
spec:
  # Two connectors, so a restart or a crash leaves the other carrying traffic.
  # cloudflared also spreads each replica's connections across two Cloudflare
  # data centres, so this is four paths in, not two.
  replicas: 2
  selector:
    matchLabels: { app: cloudflared }
  template:
    metadata:
      labels: { app: cloudflared }
    spec:
      containers:
        - name: cloudflared
          # Pinned. This is the one third-party image here and its usual tag
          # moves; IfNotPresent on a moving tag pins each node to whatever it
          # happened to pull first, which is how two nodes end up on different
          # versions with nothing saying so.
          image: cloudflare/cloudflared:2026.8.1
          args:
            - tunnel
            - --no-autoupdate
            # Metrics on localhost so the probes below have something to ask.
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: huntwell-secrets
                  key: CLOUDFLARE_TUNNEL_TOKEN
          ports:
            - { name: metrics, containerPort: 2000 }
          readinessProbe:
            httpGet: { path: /ready, port: 2000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /ready, port: 2000 }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { cpu: "25m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
