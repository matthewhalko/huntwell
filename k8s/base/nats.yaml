# The event bus. One replica: a single server carries one NATS, and clustering
# is a thing to add when there is a second machine to cluster with.
#
# JetStream is on, with a volume behind it. Core NATS drops a message that has
# no listener at that instant, which is right for "something happened" and wrong
# for the moment a service is rolling; the stream holds those until it is back.
#
# Nothing outside the cluster reaches this. There is no Ingress and the Service
# is ClusterIP: the bus is how our services talk to each other, not an API.
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: huntwell
spec:
  selector: { app: nats }
  ports:
    - { name: client, port: 4222, targetPort: 4222 }
    - { name: monitor, port: 8222, targetPort: 8222 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: huntwell
spec:
  serviceName: nats
  replicas: 1
  selector:
    matchLabels: { app: nats }
  template:
    metadata:
      labels: { app: nats }
    spec:
      containers:
        - name: nats
          image: nats:2.14-alpine
          args:
            - "--jetstream"
            - "--store_dir=/data"
            - "--http_port=8222"
          ports:
            - { name: client, containerPort: 4222 }
            - { name: monitor, containerPort: 8222 }
          volumeMounts:
            - { name: data, mountPath: /data }
          # /healthz on the monitoring port is NATS' own readiness answer.
          readinessProbe:
            httpGet: { path: /healthz, port: 8222 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8222 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 1Gi }
