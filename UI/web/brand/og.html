<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{font-family:Lato,system-ui,sans-serif;color:#fff;background:#111113;position:relative;
 background-image:radial-gradient(700px 480px at 92% -10%,rgba(54,197,240,.28),transparent 70%),radial-gradient(640px 440px at -6% 112%,rgba(224,30,90,.24),transparent 70%),radial-gradient(circle at 1px 1px,rgba(255,255,255,.07) 1px,transparent 0);
 background-size:100% 100%,100% 100%,28px 28px}
.wrap{position:absolute;inset:0;padding:80px 90px;display:flex;flex-direction:column;justify-content:space-between}
.brand{display:flex;align-items:center;gap:14px;font-size:44px;font-weight:900;letter-spacing:-.02em}
.g{background:linear-gradient(120deg,#36c5f0,#2eb67d 38%,#ecb22e 66%,#e01e5a);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:92px;line-height:1.02;font-weight:900;letter-spacing:-.035em;margin:0}
p{font-size:32px;color:rgba(255,255,255,.72);margin:22px 0 0;max-width:1040px;line-height:1.35}
.bar{height:10px;border-radius:5px;background:linear-gradient(120deg,#36c5f0,#2eb67d 38%,#ecb22e 66%,#e01e5a);width:260px}
</style></head><body><div class="wrap">
<div class="brand"><span class="g">✦</span>huntwell</div>
<div><h1>Find what you are<br><span class="g">looking for</span>.</h1>
<p>AI-powered browsing that turns web pages into data you can use.</p></div>
<div class="bar"></div></div></body></html>
